    <script>
        function initSubtitleTyping() {
            const el = document.querySelector('.subtitle-typing');
            if (!el) return;

            let subtitles = [];
            const raw = el.getAttribute('data-subtitles');
            if (raw) {
                try {
                    subtitles = JSON.parse(raw);
                } catch (error) {
                    subtitles = [raw];
                }
            }

            const text = Array.isArray(subtitles)
                ? subtitles[Math.floor(Math.random() * subtitles.length)] || ''
                : subtitles;
            if (!text) return;

            if (el._typingTimer) {
                clearInterval(el._typingTimer);
            }

            el.textContent = '';
            const cursor = document.querySelector('.typing-cursor');
            if (cursor) {
                cursor.classList.remove('typing-hidden');
                cursor.style.display = 'inline-block';
            }
            let index = 0;

            el._typingTimer = setInterval(() => {
                if (index < text.length) {
                    el.textContent += text.charAt(index);
                    index += 1;
                } else {
                    clearInterval(el._typingTimer);
                    el._typingTimer = null;
                    if (cursor) {
                        cursor.classList.add('typing-hidden');
                        cursor.style.display = 'none';
                    }
                }
            }, 80);
        }

        document.addEventListener('DOMContentLoaded', () => {
            new Pjax({
                elements: 'a[href]:not([target]):not([data-no-pjax])',
                selectors: [
                    'title',
                    '#pjax-container',
                    '#pjax-header'
                ]
            });

            initSubtitleTyping();
        });

        document.addEventListener('pjax:complete', initSubtitleTyping);
        document.addEventListener('pjax:end', initSubtitleTyping);
    </script>

<script>
function initFancybox() {
  if (window.fancyboxInstance) {
    try {
      if (typeof Fancybox.destroy === 'function') {
        Fancybox.destroy();
      } else if (typeof window.fancyboxInstance.destroy === 'function') {
        window.fancyboxInstance.destroy();
      }
    } catch (err) {
      console.warn('Fancybox destroy failed:', err);
    }
    window.fancyboxInstance = null;
  }

  const selectors = [
    '.post-content',
    '.article-content',
    '.entry-content',
    '.content',
    'article .body',
    'article'
  ];

  let articleContainer = null;
  for (let sel of selectors) {
    articleContainer = document.querySelector(sel);
    if (articleContainer) break;
  }
  if (!articleContainer) return;

  // 只获取文章内图片，排除头像、小图标
  const imgs = articleContainer.querySelectorAll(
    'img[src]:not([src*="avatar"]):not([class*="avatar"]):not([class*="icon"]):not([width="20"]):not([height="20"])'
  );
  if (!imgs.length) return;

  imgs.forEach(img => {
    // 跳过已经绑定过的
    if (img.closest('[data-fancybox]')) return;
    
    // 跳过极小图标（避免首页表情/图标被误绑）
    if (img.offsetWidth < 30 || img.offsetHeight < 30) return;

    // 给图片套放大链接
    const link = document.createElement('a');
    link.href = img.src;
    link.setAttribute('data-fancybox', 'blog-gallery');
    link.setAttribute('data-caption', img.alt || '');
    
    const parent = img.parentNode;
    parent.insertBefore(link, img);
    link.appendChild(img);
  });

  try {
    window.fancyboxInstance = Fancybox.bind('[data-fancybox="blog-gallery"]', {
      dragToClose: true,
      zoom: true,
      wheelZoom: false
    });
  } catch (err) {
    console.warn('Fancybox bind failed:', err);
    window.fancyboxInstance = null;
  }
}

document.addEventListener('DOMContentLoaded', initFancybox);

document.addEventListener('pjax:complete', initFancybox);
document.addEventListener('pjax:end', initFancybox);

</script>
