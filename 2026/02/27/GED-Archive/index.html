<script data-pjax>
function initFancybox() {
  // 先销毁旧实例，防止重复绑定
  if (window.fancyboxInstance) {
    Fancybox.unbind('[data-fancybox="blog-gallery"]');
    window.fancyboxInstance = null;
  }

  // 文章容器选择器（只匹配文章详情页，不匹配首页列表）
  const selectors = [
    '.post-content',
    '.article-content',
    '.entry-content',
    '.content',
    'article .body',
    'article'
  ];

  let articleContainer = null;
  for (let sel of selectors) {
    articleContainer = document.querySelector(sel);
    if (articleContainer) break;
  }
  if (!articleContainer) return;

  // 只获取文章内图片，排除头像、小图标
  const imgs = articleContainer.querySelectorAll(
    'img[src]:not([src*="avatar"]):not([class*="avatar"]):not([class*="icon"]):not([width="20"]):not([height="20"])'
  );
  if (!imgs.length) return;

  imgs.forEach(img => {
    // 跳过已经绑定过的
    if (img.closest('[data-fancybox]')) return;
    
    // 跳过极小图标（避免首页表情/图标被误绑）
    if (img.offsetWidth < 30 || img.offsetHeight < 30) return;

    // 给图片套放大链接
    const link = document.createElement('a');
    link.href = img.src;
    link.setAttribute('data-fancybox', 'blog-gallery');
    link.setAttribute('data-caption', img.alt || '');
    
    const parent = img.parentNode;
    parent.insertBefore(link, img);
    link.appendChild(img);
  });

  // 绑定一次
  window.fancyboxInstance = Fancybox.bind('[data-fancybox="blog-gallery"]', {
    dragToClose: true,
    zoom: true,
    wheelZoom: false
  });
}

document.addEventListener('DOMContentLoaded', initFancybox);
document.addEventListener('pjax:success', initFancybox);
</script>
